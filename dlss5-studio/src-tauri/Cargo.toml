[package]
name = "dlss5_studio"
version = "1.0.0"
description = "DLSS 5 Studio — AI-Powered Video & Image Enhancement Workstation"
authors = ["DLSS 5 Studio"]
edition = "2021"
default-run = "dlss5_studio"

[lib]
name = "dlss5_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
byteorder = "1.5"
bytes = "1.6"
regex = "1.10"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
